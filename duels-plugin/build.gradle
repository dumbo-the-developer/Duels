import org.apache.tools.ant.filters.ReplaceTokens

clean.doFirst {
    delete "$rootDir/out/"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.yml'
        filter(ReplaceTokens, tokens: [VERSION: project.version])
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations-java5:24.1.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    implementation 'io.papermc.paper:paper-api:26.2.build.132-stable'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'com.mojang:authlib:1.5.25'
    implementation 'me.clip:placeholderapi:2.12.3'
    implementation 'com.github.sirblobman.api:core:2.9-SNAPSHOT'
    implementation 'com.github.timderspieler:DeluxeCombat-API:1.5.1'
    implementation("com.github.sirblobman.combatlogx:api:11.7-SNAPSHOT")
    implementation 'com.artillexstudios:AxGraves:1.7.0'
    implementation 'com.github.No-Not-Jaden:NotBounties:1.22.36'
    implementation 'me.chancesd.pvpmanager:pvpmanager:4.0.22'
    implementation('net.essentialsx:EssentialsX:2.22.0') {
        transitive = false
    }
    implementation('com.intellectualsites.mvdwplaceholderapi:MVdWPlaceholderAPI:3.1.1') {
        transitive = false
    }
    implementation('com.github.MilkBowl:VaultAPI:1.7.1') {
        transitive = false
    }
    implementation('com.github.MinelinkNetwork.CombatTagPlus:CombatTagPlus:v1.2.4') {
        transitive = false
    }
    implementation('com.massivecraft:Factions:1.6.9.5-U0.6.35') {
        transitive = false
    }
    implementation('com.massivecraft.massivecore:MassiveCore:3.3.0') {
        transitive = false
    }
    implementation('com.massivecraft.factions:Factions:3.3.0') {
        transitive = false
    }
    implementation('de.keyle:mypet-api:3.14.3') {
        transitive = false
    }
    implementation('com.github.Nocsy-Workshop:mcpets:v4.1.11') {
        transitive = false
    }
    implementation('net.sacredlabyrinth.phaed.simpleclans:SimpleClans:2.19.2') {
        transitive = false
    }
    implementation name: 'BountyHunters-2.2.6'
    implementation name: 'LeaderHeadsAPI'

    implementation project(':duels-api')
    implementation project(':duels-worldguard')
    implementation project(':duels-worldguard-v7')
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
    implementation 'io.papermc:paperlib:1.0.8'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'org.json:json:20260814'
    implementation 'net.kyori:adventure-text-minimessage:5.2.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:5.2.0'
    implementation 'net.kyori:adventure-api:5.2.0'
    implementation 'net.kyori:examination-api:1.3.0'
    implementation 'net.kyori:adventure-key:5.2.0'
    implementation 'net.kyori:adventure-nbt:5.2.0'
}

shadowJar {
    getDestinationDirectory().set(file("$rootDir/out/"))

    final String archiveName = parent.name + '-' + project.version + '.jar'
    getArchiveFileName().set(archiveName)

    dependencies {
        include(project(':duels-api'))
        include(project(':duels-worldguard'))
        include(project(':duels-worldguard-v7'))
        include(dependency('com.fasterxml.jackson.core:.*'))
        include(dependency('io.papermc:.*'))
        include(dependency('org.json:.*'))
        include(dependency('net.kyori:adventure-text-minimessage:.*'))
        include(dependency('net.kyori:adventure-text-serializer-legacy:.*'))
        include(dependency('net.kyori:adventure-api:.*'))
        include(dependency('net.kyori:examination-api:.*'))
        include(dependency('net.kyori:adventure-key:.*'))
        include(dependency('net.kyori:adventure-nbt:.*'))
    }

    final String group = project.group.toString() + "." + parent.name.toLowerCase() + ".shaded."
    relocate 'com.fasterxml.jackson', 'com.meteordevelopments.duels.shaded.jackson'
    relocate 'io.papermc.lib', group + 'paperlib'
}

// To build Duels plugin jar, run './gradlew clean build'.
build {
    dependsOn(shadowJar)
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group.toString()
            artifactId = project.name.toLowerCase()
            version = project.version
            from components.java
        }
    }
}
